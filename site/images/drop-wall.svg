    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff5cd" stop-opacity=".19"/><stop offset=".5" stop-color="#f2d994" stop-opacity=".05"/><stop offset="1" stop-color="#fff5cd" stop-opacity=".19"/></linearGradient>
    <pattern id="grid" width="11" height="11" patternUnits="userSpaceOnUse"><path d="M11 0H0V11" stroke="#fff3ca" stroke-opacity=".28" stroke-width=".55"/></pattern>
    <clipPath id="outline"><path d="M10 42 37 18 112 5H336L411 18 438 42V158L336 175H112L10 158Z"/></clipPath>
