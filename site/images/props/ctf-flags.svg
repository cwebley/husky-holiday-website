<svg xmlns="http://www.w3.org/2000/svg" width="300" height="380" viewBox="0 0 360 456">
<defs>
  <linearGradient id="red" x2="1" y2=".3"><stop stop-color="#701D26"/><stop offset=".45" stop-color="#C34448"/><stop offset="1" stop-color="#90252F"/></linearGradient>
  <linearGradient id="blue" x2="1" y2=".3"><stop stop-color="#1A435F"/><stop offset=".5" stop-color="#497F9A"/><stop offset="1" stop-color="#23546F"/></linearGradient>
  <linearGradient id="pole"><stop stop-color="#343D42"/><stop offset=".45" stop-color="#AEB6B5"/><stop offset=".65" stop-color="#697675"/><stop offset="1" stop-color="#293439"/></linearGradient>
  <linearGradient id="base" x2="0" y2="1"><stop stop-color="#6C7774"/><stop offset="1" stop-color="#303C3B"/></linearGradient>
  <linearGradient id="crate" x2="1" y2=".2"><stop stop-color="#344539"/><stop offset=".5" stop-color="#596C4F"/><stop offset="1" stop-color="#303F33"/></linearGradient>
  <!-- Original Husky Holiday favicon, embedded so this SVG stays self-contained. -->
  <g id="crest">
    <image x="-25" y="-25" width="50" height="50" href="data:image/png;base64,"/>
  </g>
  <g id="captured-flag">
    <rect x="-3" y="0" width="6" height="230" rx="2" fill="url(#pole)" stroke="#253034"/>
    <path d="M0 -12L6 0 0 5 -6 0Z" fill="#B9C2BC" stroke="#3B4748" stroke-width="1.5"/>
    <path d="M4 12Q31 4 60 18L53 48 58 85Q28 72 4 82Z" fill="url(#blue)" stroke="#15394E" stroke-width="2"/>
    <path d="M8 18Q30 11 55 21M8 77Q30 69 54 80" fill="none" stroke="#E4BD82" stroke-width="2"/>
    <path d="M28 11Q24 44 31 77" fill="none" stroke="#B6D5D8" stroke-width="2" opacity=".2"/>
    <use href="#crest" transform="translate(31 46) scale(.65)"/>
  </g>
</defs>
<!-- Tight contact shadows under two solid objects, both resting on the floor. -->
<ellipse cx="114" cy="448" rx="95" ry="5" fill="#110D0A" opacity=".5"/>
<ellipse cx="278" cy="448" rx="74" ry="5" fill="#110D0A" opacity=".45"/>
