    <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#183E52"/><stop offset=".55" stop-color="#1A5363"/><stop offset="1" stop-color="#071620"/></linearGradient>
    <linearGradient id="plastic" x2="1" y2="1"><stop stop-color="#384345"/><stop offset=".45" stop-color="#20292B"/><stop offset="1" stop-color="#101719"/></linearGradient>
