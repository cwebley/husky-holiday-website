<path d="M29 40 Q17 28 21 14 L30 6 Q42 6 49 17 L51 37 L43 44 Z" fill="url(#metal)" stroke="#29273B" stroke-width="2"/>
<path d="M21 18 Q16 8 24 4 Q39 -1 48 9 L51 18 L44 16 Q36 6 27 12 Z" fill="url(#hull)" stroke="#433057" stroke-width="2"/>
