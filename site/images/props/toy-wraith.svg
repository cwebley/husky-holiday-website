<path d="M39 14 L58 17 M39 18 L58 21" stroke="#68E8FF" stroke-width="1.7"/>
<path d="M63 16 L68 18 L68 22 L63 23 Z" fill="#C0FBFF" stroke="#5ACDED"/>
<path d="M25 21 L29 30 M31 18 L35 28 M37 22 L40 30" stroke="#79E2F6" stroke-width="2"/>
<!-- Broad sloping central carapace with a heavy rounded nose. -->
<path d="M39 32 Q57 22 77 32 Q99 43 109 57 Q113 65 104 69 L75 68 Q52 60 38 51 L30 44 Z" fill="url(#hull)" stroke="#3A294B" stroke-width="2"/>
<path d="M45 33 Q61 28 76 36 Q89 44 100 56" fill="none" stroke="#CEAAF2" stroke-width="2" opacity=".8"/>
<path d="M43 37 Q62 41 71 49 L78 66 M70 32 Q62 38 69 43 L85 47 Q95 47 98 54" fill="none" stroke="#523268" stroke-width="1.3"/>
<path d="M89 49 Q97 48 103 57 L105 65 L92 66 Q83 59 85 55 Z" fill="#9462B9" stroke="#543568" stroke-width="1.2"/>
<path d="M98 60 L104 61 M98 63 L104 64" stroke="#30283D" stroke-width="1.3"/>
<!-- Small upper gun mount. -->
<path d="M55 34 L61 29 L70 33 L70 38 L60 40 Z" fill="#695086" stroke="#3B2C4D" stroke-width="1.3"/>
<path d="M61 30 Q65 24 73 26 L78 28 L76 31 L65 34 Z" fill="#A175D0" stroke="#49315F" stroke-width="1.5"/>
<!-- Near prow pod is separate from the body, not a continuous crescent skirt. -->
<path d="M43 56 Q57 46 76 54 Q87 60 98 64 L118 65 Q121 69 116 73 Q101 79 83 74 L52 71 L40 65 Z" fill="url(#pod)" stroke="#36283F" stroke-width="2"/>
<path d="M47 57 Q61 51 75 59 L88 65" fill="none" stroke="#D4ADF1" stroke-width="2"/>
<path d="M80 59 L75 69 L79 73 M103 65 L100 75" fill="none" stroke="#453248" stroke-width="3"/>
<path d="M87 71 L91 72 M96 73 L100 74 M111 71 L115 70" stroke="#9BEFFF" stroke-width="2" stroke-linecap="round"/>
</svg>
