<path d="M14 34 L48 26 L76 43 L74 63 L39 68 L12 54 Z" fill="#292A3E" stroke="#242233" stroke-width="2"/>
<path d="M15 39 L29 34 L42 44 L36 59 L16 59 L10 50 Z" fill="url(#metal)" stroke="#29303F" stroke-width="2"/>
<path d="M17 42 L29 40 M15 47 L29 45 M16 52 L27 50" stroke="#A2A5B0" stroke-width="2"/>
<path d="M13 58 Q5 59 5 68 L19 65 L27 59" fill="url(#hull)" stroke="#34283F" stroke-width="2"/>
