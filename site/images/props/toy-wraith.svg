<svg xmlns="http://www.w3.org/2000/svg" width="124" height="80" viewBox="0 0 124 80">
<defs>
<linearGradient id="hull" x1=".2" y1="0" x2=".7" y2="1"><stop stop-color="#B493E8"/><stop offset=".45" stop-color="#8959BB"/><stop offset="1" stop-color="#493966"/></linearGradient>
<linearGradient id="pod" x2=".4" y2="1"><stop stop-color="#C19BE8"/><stop offset=".5" stop-color="#8C60C0"/><stop offset="1" stop-color="#493455"/></linearGradient>
<linearGradient id="metal" x2="0" y2="1"><stop stop-color="#889AA6"/><stop offset=".4" stop-color="#394E5D"/><stop offset="1" stop-color="#1D293A"/></linearGradient>
<radialGradient id="hover"><stop stop-color="#9CEEFF" stop-opacity=".65"/><stop offset="1" stop-color="#51CFF5" stop-opacity="0"/></radialGradient>
</defs>
<!-- Three-quarter miniature Wraith. Prow faces right; tall mortar is at the rear. -->
<ellipse cx="65" cy="75" rx="55" ry="4" fill="#120F1A" opacity=".5"/>
<ellipse cx="65" cy="70" rx="52" ry="8" fill="url(#hover)"/>
<!-- Separate far forward armor pod. -->
<path d="M71 29 Q86 19 104 33 L117 47 Q108 51 93 45 L76 41 Z" fill="url(#pod)" stroke="#30253F" stroke-width="2"/>
<path d="M90 29 L101 36 L112 42" fill="none" stroke="#D1A7EE" stroke-width="1.5"/>
<path d="M103 34 L107 42 L115 46" fill="none" stroke="#44344F" stroke-width="3"/>
